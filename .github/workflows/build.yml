name: build

# Reusable workflow: triggered directly on push/PR, and called by
# release.yml (which then downloads the aa2acp-artifacts artifact).
on:
  workflow_call:
    inputs:
      build_type:
        description: CMAKE_BUILD_TYPE for the build job
        type: string
        default: RelWithDebInfo
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config git \
            libssl-dev libboost1.83-all-dev libabsl-dev protobuf-compiler libprotobuf-dev \
            libusb-1.0-0-dev libdbus-1-dev libbluetooth-dev \
            libavcodec-dev libavutil-dev

      - name: Cache aasdk/aap_protobuf
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: .deps/install
          key: aasdk-${{ hashFiles('deps.lock') }}-${{ hashFiles('patches/aasdk/*.patch') }}

      - name: Build pinned dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-deps.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'RelWithDebInfo' }} -DCMAKE_PREFIX_PATH="$PWD/.deps/install"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake
          mv *.deb aa2acp.deb
          cp build/aa2acp aa2acp

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aa2acp-artifacts
          path: |
            aa2acp
            aa2acp.deb
          retention-days: 7

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          # Match the version pinned by flake.nix (llvmPackages_21.clang-tools).
          pip install --break-system-packages 'clang-format==21.*'
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
