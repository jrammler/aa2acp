name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config git ccache \
            libssl-dev libboost1.83-all-dev libabsl-dev protobuf-compiler libprotobuf-dev \
            libusb-1.0-0-dev libdbus-1-dev libbluetooth-dev \
            libavcodec-dev libavutil-dev

      - name: Cache aasdk/aap_protobuf
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: aasdk-${{ hashFiles('deps.lock') }}-${{ hashFiles('patches/aasdk/*.patch') }}

      - name: Build pinned dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-deps.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$PWD/.deps/install"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aa2acp-binaries
          path: |
            build/aa2acp
            build/aa2acp-android-auto-usb
          retention-days: 7

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          # Match the version used by the Nix dev shell (clang-tools).
          pip install --break-system-packages 'clang-format==21.*'
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
