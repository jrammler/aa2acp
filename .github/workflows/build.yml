name: build

# Reusable workflow: triggered directly on push/PR, and called by
# release.yml (which then downloads the aa2acp-artifacts artifact).
on:
  workflow_call:
    inputs:
      build_type:
        description: CMAKE_BUILD_TYPE for the build job
        type: string
        default: RelWithDebInfo
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Build inside the target distro (Raspberry Pi OS trixie base) so the
    # deb's shared-library sonames match the Pi at runtime.
    runs-on: ubuntu-26.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe needs the tags

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake g++ pkg-config git dpkg-dev file binutils ca-certificates \
            libssl-dev \
            libboost1.83-dev libboost-system1.83-dev libboost-log1.83-dev libboost-test1.83-dev \
            libabsl-dev protobuf-compiler libprotobuf-dev \
            libusb-1.0-0-dev libdbus-1-dev libbluetooth-dev \
            libavcodec-dev libavutil-dev

      - name: Compute toolchain fingerprint
        id: toolchain
        run: |
          echo "hash=$( (gcc --version; protoc --version; cmake --version; dpkg-query -W -f='${Package}=${Version}\n' libabsl-dev libboost1.83-dev libprotobuf-dev protobuf-compiler) | sha256sum | cut -d' ' -f1 )" >> "$GITHUB_OUTPUT"

      - name: Restore aasdk/aap_protobuf cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: .deps/install
          key: aasdk-trixie-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('deps.lock') }}-${{ hashFiles('patches/aasdk/*.patch') }}

      # Run unconditionally: build-deps.sh validates its own stamp (rev +
      # patches + toolchain) and exits early on a hit. A restored cache can
      # contain a stale or partial install; only the script knows for sure.
      - name: Build pinned dependencies
        run: ./scripts/build-deps.sh

      # Save as soon as the validated dependency build succeeds. Later app
      # build, test, or packaging failures must not discard this expensive,
      # independently keyed cache entry.
      - name: Save aasdk/aap_protobuf cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .deps/install
          key: aasdk-trixie-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('deps.lock') }}-${{ hashFiles('patches/aasdk/*.patch') }}

      - name: Verify patch list matches flake.nix
        run: |
          for patch in patches/aasdk/*.patch; do
            name="$(basename "$patch")"
            grep -q "$name" flake.nix || {
              echo "::error::patches/aasdk/$name is not listed in flake.nix - Nix builds would silently skip it"
              exit 1
            }
          done

      - name: Configure
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          # Container actions see the checked-out source but not its .git
          # directory. Tag builds retain the release version; ordinary CI
          # artifacts carry their immutable GitHub commit identifier.
          if [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            version="${version}~g$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ inputs.build_type || 'RelWithDebInfo' }} -DCMAKE_PREFIX_PATH="$PWD/.deps/install" -DAA2ACP_VERSION="$version"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          # Let dpkg-shlibdeps resolve the bundled aasdk libs (they are
          # shipped inside the deb, so no distro dependency is generated
          # for them; everything else gets a proper Depends entry).
          for f in .deps/install/lib/libaasdk.so* .deps/install/lib/libaap_protobuf.so*; do
            ln -sf "$PWD/$f" /usr/lib/aarch64-linux-gnu/
          done
          cpack --config build/CPackConfig.cmake
          mv *.deb aa2acp.deb
          cp build/aa2acp aa2acp
          # Smoke-test the package layout before publishing artifacts. This
          # catches missing private libraries/assets without starting systemd
          # in the build container.
          package_root="$(mktemp -d)"
          package_control=""
          trap 'rm -rf "$package_root" "$package_control"' EXIT
          dpkg-deb --info aa2acp.deb
          dpkg-deb -f aa2acp.deb Depends | grep -q 'network-manager'
          dpkg-deb -f aa2acp.deb Depends | grep -q 'bluez'
          dpkg-deb --extract aa2acp.deb "$package_root"
          package_control="$(mktemp -d)"
          dpkg-deb --control aa2acp.deb "$package_control"
          test -x "$package_control/postinst"
          test -x "$package_root/usr/bin/aa2acp"
          test -s "$package_root/usr/share/aa2acp/display-preflight.h264"
          test -e "$package_root/usr/lib/aa2acp/libaasdk.so"
          test -e "$package_root/usr/lib/aa2acp/libaap_protobuf.so"
          test -e "$package_root/usr/lib/systemd/system/aa2acp.service"
          test -e "$package_root/usr/lib/udev/rules.d/70-aa2acp-android-auto.rules"
          test -e "$package_root/usr/share/polkit-1/rules.d/49-aa2acp-networkmanager.rules"
          test -x packaging/deb/postinst
          readelf -d "$package_root/usr/bin/aa2acp" | \
            grep -E '(RPATH|RUNPATH)' | tee package-rpath.txt
          grep -Fq '$ORIGIN/../lib/aa2acp' package-rpath.txt
          ldd "$package_root/usr/bin/aa2acp" | tee package-ldd.txt
          ! grep -q 'not found' package-ldd.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aa2acp-artifacts
          path: |
            aa2acp
            aa2acp.deb
          retention-days: 7

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          # Match the version pinned by flake.nix (llvmPackages_21.clang-tools).
          pip install --break-system-packages 'clang-format==21.*'
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
