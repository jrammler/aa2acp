name: release

# Cut a GitHub release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
# Reuses the build workflow; the release job attaches its artifacts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify-version:
    # Guard against tagging without bumping the VERSION file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($FILE_VERSION). Bump VERSION and re-tag."
            exit 1
          fi

  build:
    needs: verify-version
    uses: ./.github/workflows/build.yml
    with:
      build_type: Release

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: aa2acp-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            aa2acp.deb
            aa2acp
