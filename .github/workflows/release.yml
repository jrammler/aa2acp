name: release

# Cut a GitHub release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
# Reuses the build workflow; the release job attaches its artifacts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      build_type: Release

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: aa2acp-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            aa2acp.deb
            aa2acp
